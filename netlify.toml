[build]
  publish = "."

# Security and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Redirects
[[redirects]]
  from = "/privacy"
  to = "https://app.notion.com/p/Numpath-Puzzle-Privacy-Policy-3d450ced4a4e8080a553d21c041fedac"
  status = 301
  force = false

[[redirects]]
  from = "/terms"
  to = "/"
  status = 301
  force = true
